<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification Log</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 10px;
        overflow-x: hidden;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 1.5em;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        table-layout: fixed;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
        vertical-align: top;
        word-wrap: break-word;
        overflow-wrap: break-word;
        hyphens: auto;
      }

      th {
        background-color: #f2f2f2;
        font-weight: bold;
        position: sticky;
        top: 0;
      }

      .time-app {
        width: 20%;
        min-width: 120px;
        font-size: 12px;
      }

      .time-app .time {
        font-weight: bold;
        color: #333;
      }

      .time-app .app {
        color: #666;
        font-style: italic;
      }

      /* Title column */
      th:nth-child(2),
      td:nth-child(2) {
        width: 25%;
        max-width: 200px;
      }

      /* Text column */
      th:nth-child(3),
      td:nth-child(3) {
        width: 55%;
        word-break: break-all;
        overflow-wrap: anywhere;
      }

      button {
        background-color: red;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
      }

      button:hover {
        background-color: darkred;
      }

      /* Fixed Delete button */
      .fab-delete {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: #dc3545;
        color: #fff;
        border: none;
        padding: 10px 16px;
        border-radius: 9999px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        z-index: 1000;
      }

      .fab-delete:hover {
        background-color: #b02a37;
      }

      .fab-delete svg {
        width: 18px;
        height: 18px;
      }

      /* Spinner */
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: none;
      }

      .spinner.visible {
        display: inline-block;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Mobile responsiveness */
      @media screen and (max-width: 768px) {
        body {
          padding: 5px;
        }

        h1 {
          font-size: 1.2em;
        }

        table {
          font-size: 12px;
        }

        th,
        td {
          padding: 6px 4px;
        }

        .time-app {
          min-width: 100px;
          font-size: 11px;
          width: 25%;
        }

        th:nth-child(2),
        td:nth-child(2) {
          width: 30%;
          max-width: 150px;
        }

        th:nth-child(3),
        td:nth-child(3) {
          width: 45%;
        }
      }

      @media screen and (max-width: 480px) {
        table {
          font-size: 11px;
        }

        th,
        td {
          padding: 4px 2px;
        }

        .time-app {
          min-width: 80px;
          font-size: 10px;
          width: 30%;
        }

        th:nth-child(2),
        td:nth-child(2) {
          width: 25%;
          max-width: 120px;
        }

        th:nth-child(3),
        td:nth-child(3) {
          width: 45%;
          font-size: 10px;
        }

        h1 {
          font-size: 1.1em;
          margin-bottom: 10px;
        }

        .fab-delete {
          padding: 16px 22px;
          font-size: 14px;
        }

        .fab-delete svg {
          width: 20px;
          height: 20px;
        }
      }

      @media screen and (max-width: 360px) {
        .time-app {
          width: 35%;
        }

        th:nth-child(2),
        td:nth-child(2) {
          width: 20%;
          max-width: 100px;
        }

        th:nth-child(3),
        td:nth-child(3) {
          width: 45%;
          font-size: 9px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Notification Log</h1>
    <table id="logTable">
      <thead>
        <tr>
          <th class="time-app">Time/App</th>
          <th>Title</th>
          <th>Text</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data will be inserted here by JavaScript -->
      </tbody>
    </table>

    <!-- Fixed Delete All button -->
    <button
      id="deleteAllBtn"
      class="fab-delete"
      title="Delete all logs"
      aria-label="Delete all logs"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        <path d="M10 11v6"></path>
        <path d="M14 11v6"></path>
        <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>
      </svg>
      <span class="spinner" id="deleteSpinner" aria-hidden="true"></span>
    </button>

    <script>
      const apiUrl =
        "https://mocklog-76c05-default-rtdb.asia-southeast1.firebasedatabase.app/log.json";

      // Optional: supply an auth token if your rules require it
      // Example: const authToken = "YOUR_ID_TOKEN_HERE";
      const authToken = undefined;

      fetch(apiUrl)
        .then((response) => response.json())
        .then((data) => {
          const logTableBody = document
            .getElementById("logTable")
            .querySelector("tbody");
          if (
            !data ||
            (typeof data === "object" && Object.keys(data).length === 0)
          ) {
            const emptyRow = document.createElement("tr");
            const emptyCell = document.createElement("td");
            emptyCell.colSpan = 3;
            emptyCell.textContent = "No logs available";
            emptyRow.appendChild(emptyCell);
            logTableBody.appendChild(emptyRow);
            return;
          }

          const sortedKeys = Object.keys(data || {}).reverse();

          sortedKeys.forEach((key) => {
            const log = data[key] || {};
            const notification = log.notification || {};
            const row = document.createElement("tr");

            // Combined Time/App cell
            const timeAppCell = document.createElement("td");
            timeAppCell.className = "time-app";
            const timeValue =
              notification.time != null ? Number(notification.time) : undefined;
            const date = timeValue ? new Date(timeValue) : null;
            const timeText = date
              ? date.toLocaleString(undefined, {
                  year: "numeric",
                  month: "short",
                  day: "2-digit",
                  hour: "numeric",
                  minute: "2-digit",
                  second: "2-digit",
                  hour12: true,
                })
              : "-";
            const appText = log.app || "-";
            timeAppCell.innerHTML = `<div class="time">${timeText}</div><div class="app">${appText}</div>`;
            row.appendChild(timeAppCell);

            const titleCell = document.createElement("td");
            titleCell.textContent = notification.title || "";
            row.appendChild(titleCell);

            const textCell = document.createElement("td");
            textCell.textContent = notification.text || "";
            row.appendChild(textCell);

            logTableBody.appendChild(row);
          });
        })
        .catch((error) => console.error("Error fetching data:", error));

      // Delete All handler
      const deleteBtn = document.getElementById("deleteAllBtn");
      const deleteSpinner = document.getElementById("deleteSpinner");

      async function deleteAllLogs() {
        if (
          !confirm(
            "Are you sure you want to delete ALL log entries? This cannot be undone."
          )
        ) {
          return;
        }
        try {
          deleteBtn.disabled = true;
          deleteSpinner.classList.add("visible");

          const url = authToken
            ? `${apiUrl}?auth=${encodeURIComponent(authToken)}`
            : apiUrl;
          const response = await fetch(url, { method: "DELETE" });
          if (!response.ok) {
            throw new Error(
              `Request failed: ${response.status} ${response.statusText}`
            );
          }
          // Success - reload to reflect empty list
          location.reload();
        } catch (err) {
          alert("Failed to delete logs: " + err.message);
        } finally {
          deleteSpinner.classList.remove("visible");
          deleteBtn.disabled = false;
        }
      }

      deleteBtn.addEventListener("click", deleteAllLogs);
    </script>
  </body>
</html>
